<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AP Enterprises · Members</title>
    <meta
      name="description"
      content="AP Enterprises · Quiet stewardship for residences of consequence. A private members service for luxury residential communities in South Florida."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preload above-the-fold fonts so paint isn't blocked on CSS discovery. -->
    <link rel="preload" href="/fonts/fraunces/Fraunces_72pt-Light.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/inter/Inter_18pt-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/inter/Inter_18pt-Medium.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Hint the browser to set up the lucide CDN connection early, then load
         the script after parsing so it never blocks first paint. -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js" defer></script>
  </body>
</html>
