# AP Enterprises — local Supabase config.
# Run `supabase init` to regenerate; do not edit project_id by hand.
project_id = "ap-enterprises-members"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/reset"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.create-resident-user]
verify_jwt = true

[functions.cancel-booking]
verify_jwt = true
