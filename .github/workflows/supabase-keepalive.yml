name: Supabase keep-alive

# Supabase free tier pauses a project after ~7 days of inactivity. Any REST
# API call counts as activity, so we ping a cheap endpoint daily. The query
# selects a single id from `properties` — read-only, no side effects, and
# small enough that it never shows up in usage metrics.

on:
  schedule:
    # 12:00 UTC every day. Cron is UTC; GitHub may delay scheduled runs by
    # several minutes under load, which is fine — we have a 7-day buffer.
    - cron: '0 12 * * *'
  workflow_dispatch:  # also runnable on-demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is empty."
            exit 1
          fi
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/properties?select=id&limit=1")
          echo "HTTP ${status}"
          cat /tmp/body
          # 200 (rows) and 206 (partial-content range) both mean PostgREST is
          # alive. Anything else is a real failure worth alerting on.
          case "${status}" in
            200|206) echo "Keep-alive OK." ;;
            *) echo "::error::Unexpected status ${status}"; exit 1 ;;
          esac
